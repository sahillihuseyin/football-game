main{max-width:480px;margin:0 auto;padding:22px 18px;position:relative;z-index:1}
h1{font-size:30px;font-weight:900;text-align:center;margin:6px 0 4px;color:#fff;letter-spacing:1px;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tag{text-align:center;color:#fff;opacity:.9;font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
input,button{font:inherit;font-size:17px;border-radius:14px;border:2px solid var(--bd);padding:14px;width:100%;min-height:52px}
input{background:#fff;color:var(--ink)}input:focus{outline:none;border-color:var(--ac)}
button{background:var(--yellow);color:var(--ink);border:0;font-weight:800;cursor:pointer;margin-top:10px;box-shadow:0 4px 0 #c9a600;transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a600}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--bd);box-shadow:none}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.board{background:#0c2a18;color:#fff;border-radius:18px}
.sc{flex:1;text-align:center;font-size:36px;font-weight:900;opacity:.55;color:#fff}.sc.on{opacity:1;color:var(--yellow)}.sc small{display:block;font-size:12px;font-weight:600;letter-spacing:.5px}
.board .mut{color:#fff}
.team{font-size:28px;font-weight:900;text-align:center;margin:8px 0;color:var(--ac)}
.code{font-size:40px;font-weight:900;letter-spacing:4px;text-align:center;margin:10px 0;background:var(--bg);border-radius:14px;padding:10px}

.mut{color:var(--mut);font-size:14px;text-align:center}.msg{text-align:center;font-weight:700;min-height:22px;margin-top:8px}
.ad{border:2px dashed rgba(255,255,255,.7);color:#fff;text-align:center;padding:18px;border-radius:12px;font-size:13px}
.hide{display:none!important}
